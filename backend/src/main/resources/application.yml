spring:
  application:
    name: room-reservation-platform
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.example.room_reservation_platform: INFO

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  security:
    jwt:
      secret: ${JWT_SECRET:change-this-to-a-long-random-string}
      access-token-expires-in: ${JWT_ACCESS_TOKEN_EXPIRES_IN:1800}
      refresh-token-expires-in: ${JWT_REFRESH_TOKEN_EXPIRES_IN:1209600}
