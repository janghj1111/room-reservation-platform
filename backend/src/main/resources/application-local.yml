spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:13307}/${DB_NAME:room_reservation}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:room_user}
    password: ${DB_PASSWORD:room_password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: true

#  sql:
#    init:
#      mode: always
#      schema-locations: classpath:db/schema/mysql/001-init-schema.sql

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.example.room_reservation_platform

logging:
  level:
    org.springframework.jdbc: INFO
    org.mybatis: INFO
